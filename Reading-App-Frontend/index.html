<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deckle — Serial Library & Scriptorium</title>

    <!-- Dark Mode Preference Script (Prevents White Screen Flash) -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (
          theme === 'dark' ||
          ((!theme || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-surface dark:bg-[#141310] text-on-surface dark:text-[#e6e2d9] min-h-screen antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
